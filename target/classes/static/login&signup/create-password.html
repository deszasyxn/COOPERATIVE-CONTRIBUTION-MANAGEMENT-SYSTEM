<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Admin Password</title>
  <link rel="stylesheet" href="logsignDesigns.css">
</head>
<body>
  <main class="page">
    <header class="welcome">
      <h1>Create Password</h1>
      <p>Finish setting up your admin account</p>
    </header>

    <section class="card">
      <form id="password-form" novalidate>
        <p class="setup-copy">Choose a password for the admin account. This setup link expires after 30 minutes.</p>

        <div class="field">
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password"
                   placeholder="At least 8 characters" required>
            <button type="button" class="toggle-pw" aria-label="Show password" aria-controls="password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <g class="eye-closed">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M3 21 21 3"/>
                </g>
                <g class="eye-open">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </g>
              </svg>
            </button>
          </div>
          <label for="password">Password</label>
        </div>

        <div class="field">
          <div class="input-wrap">
            <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password"
                   placeholder="Enter your password again" required>
            <button type="button" class="toggle-pw" aria-label="Show password" aria-controls="confirm-password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <g class="eye-closed">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M3 21 21 3"/>
                </g>
                <g class="eye-open">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </g>
              </svg>
            </button>
          </div>
          <label for="confirm-password">Confirm Password</label>
        </div>

        <p class="form-feedback" id="setup-feedback" role="alert" hidden></p>
        <button type="submit" class="btn" id="create-account-btn">CREATE ACCOUNT</button>
      </form>
    </section>
  </main>

  <script src="create-password.js"></script>
</body>
</html>
