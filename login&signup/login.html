<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="../login&signup/logsignDesigns.css">
</head>
<body>
  <main class="page">
    <header class="welcome">
      <h1>Welcome Back</h1>
      <p>Sign in to continue</p>
    </header>

    <section class="card">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="38" r="15" fill="#3b82f6"/>
          <path d="M20 100c0-24 13-38 30-38s30 14 30 38z" fill="#3b82f6"/>
        </svg>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <div class="input-wrap">
            <input type="text" id="username" name="username" value="" placeholder="Enter Username" autocomplete="username" required>
          </div>
          <label for="username">Username or Email</label>
          <span class="error">Enter your username or email.</span>
        </div>

        <div class="field">
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" aria-label="Show password" aria-controls="password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <g class="eye-closed">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M3 21 21 3"/>
                </g>
                <g class="eye-open">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </g>
              </svg>
            </button>
          </div>
          <label for="password">Password</label>
          <span class="error">Enter your password.</span>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" name="remember" checked>
            Remember Me
          </label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">LOGIN</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
